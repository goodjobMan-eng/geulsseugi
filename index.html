<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>글쓰기어플</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#faf7ef">
<style>
  :root{
    --desk:#ecebe7;
    --desk-deep:#dcdad4;
    --bar:#fbf8f1;
    --ink:#3f3a32;
    --ink-soft:#8a8173;
    --pencil:#e8b93a;
    --pencil-soft:#fbefc8;
    --red:#c84c3a;
    --line:rgba(60,45,20,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,var(--desk) 0%,var(--desk-deep) 100%);
    color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
  #bar{position:relative;z-index:5;display:flex;align-items:center;gap:6px;height:60px;padding:0 12px;background:var(--bar);
    border-bottom:1px solid var(--line);box-shadow:0 2px 10px -6px rgba(70,50,20,.35)}
  .brand{display:flex;align-items:center;gap:8px;font-family:"Nanum Myeongjo","Noto Serif KR","Batang",serif;font-weight:700;font-size:17px;letter-spacing:-.02em;margin-right:6px;white-space:nowrap}
  .kindwrap{position:relative;display:inline-flex}
  #kindBtn{height:44px;padding:0 10px 0 6px;border-radius:12px;gap:8px;color:var(--ink)} #kindBtn:hover{background:rgba(60,45,20,.06)}
  #kindIcon svg,#kindMenu svg{width:38px;height:28px;flex:none;filter:drop-shadow(0 1px 1px rgba(60,45,20,.22))}
  #kindMenu{position:absolute;top:52px;left:0;z-index:30;min-width:250px;padding:6px;background:#fffdf8;border-radius:14px;box-shadow:0 12px 32px -10px rgba(60,45,20,.45),0 0 0 1px rgba(60,45,20,.08);display:none;font-family:inherit}
  #kindMenu.open{display:block}
  #kindMenu h6{margin:8px 10px 4px;font:600 11.5px/1 system-ui,sans-serif;letter-spacing:.12em;color:#8a7f6e}
  #kindMenu button{width:100%;justify-content:flex-start;height:48px;gap:12px;font:500 15px/1.2 "Nanum Myeongjo","Noto Serif KR","Batang",serif;border-radius:10px}
  #kindMenu button small{margin-left:auto;font:12px/1 system-ui,sans-serif;color:#8a7f6e}
  #kindMenu button.on{background:var(--pencil-soft)}
  .brand i{width:9px;height:22px;border-radius:2px;background:linear-gradient(90deg,#d9a92c,#f1c84d 45%,#d9a92c);box-shadow:inset 0 -5px 0 #e9cfa6}
  .group{display:flex;align-items:center;gap:2px;padding:0 4px;border-left:1px solid var(--line)}
  .spacer{flex:1}
  button{font:inherit;color:inherit;background:transparent;border:0;height:44px;min-width:44px;padding:0 11px;border-radius:11px;
    display:inline-flex;align-items:center;gap:6px;font-size:15px;cursor:pointer;white-space:nowrap;transition:background .15s}
  button:hover{background:rgba(60,45,20,.06)}
  button:active{transform:translateY(1px)}
  button svg{width:22px;height:22px;flex:none}
  .penwrap{position:relative;display:inline-flex}
  button svg.caret{width:10px;height:10px;margin-left:-2px;opacity:.55}
  #penMenu{position:absolute;top:50px;left:0;z-index:20;min-width:270px;padding:6px;background:#fffdf8;border-radius:14px;
    box-shadow:0 12px 32px -10px rgba(50,40,20,.45),0 0 0 1px rgba(60,45,20,.08);display:none}
  #penMenu.open{display:block}
  #penMenu button{width:100%;justify-content:flex-start;height:48px;gap:10px}
  #penMenu button.on{background:var(--pencil-soft)}
  #penMenu .fs{display:none;flex-wrap:wrap;gap:4px;padding:6px 6px 2px;border-top:1px solid var(--line);margin-top:4px;font-size:12px;color:var(--ink-soft);align-items:center}
  #penMenu .fs button{width:auto;height:34px;font-size:13px;padding:0 10px;background:rgba(60,45,20,.06)}
  #penMenu .fs button.on{background:#e3e8f6;color:#1f2d5e;box-shadow:inset 0 -2px 0 #1f2d5e}
  #penIcon svg{width:28px;height:28px;flex:none}
  #penMenu button > svg{width:36px;height:36px;flex:none}
  #penMenu canvas{width:64px;height:16px;margin-left:auto}
  #penMenu .csw{display:flex;flex-wrap:wrap;gap:8px;padding:2px 12px 10px 56px}
  #penMenu .csw .sw{width:24px;height:24px;min-width:0;padding:0;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 2px rgba(255,255,255,.75),0 1px 2px rgba(0,0,0,.25)}
  #penMenu .csw .sw.on{box-shadow:inset 0 0 0 2px rgba(255,255,255,.9),0 0 0 2.5px #3a342c}
  .tool.on{background:var(--pencil-soft);box-shadow:inset 0 -3px 0 var(--pencil)}
  .seg{display:inline-flex;padding:3px;border-radius:12px;background:rgba(60,45,20,.07);margin:0 4px}
  .seg button{height:38px;padding:0 12px;border-radius:9px;font-size:14px;color:var(--ink-soft)}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(60,45,20,.18)}
  .size{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-soft);padding:0 6px;white-space:nowrap}
  .size .seg button{height:34px;padding:0 10px;font-size:13.5px} .size .seg i{font-style:normal} .size .seg i.s{display:none}
  @media (max-width:760px){ #paperBtn{min-width:36px;padding:0 6px} #kindBtn{padding:0 4px 0 2px;gap:4px} }
  @media (max-width:800px){ .size .seg i.f{display:none} .size .seg i.s{display:inline} .size .seg button{min-width:34px} } .size.locked .seg{opacity:.45}
  .size em{font-style:normal;font-size:12.5px;min-width:52px}
  .status{font-size:12.5px;color:var(--ink-soft);padding:0 8px;white-space:nowrap}
  .status b{display:inline-block;width:7px;height:7px;border-radius:50%;background:#c9c0ae;margin-right:6px;vertical-align:1px}
  .status.live b{background:#6aa35a}
  #finger.on{color:var(--red)}
  #paperLabel{display:none}
  @media (max-width:1320px){ .status{display:none} }
  #desk{position:absolute;left:0;right:0;top:60px;bottom:0}
  /* 필사: 원고지 위의 시 칸 */
  #copyBox{position:absolute;z-index:3;display:none;flex-direction:column;background:#fffdf7;border-radius:6px;
    box-shadow:0 1px 2px rgba(60,45,20,.12),0 6px 18px -8px rgba(60,45,20,.28)}
  #copyBox.show{display:flex}
  #copyBox .hd{display:flex;align-items:center;gap:4px;padding:4px 6px 0 10px}
  #copyPick{height:38px;padding:0 8px;gap:8px;font-family:"Nanum Myeongjo","Noto Serif KR","AppleMyungjo","Batang",serif}
  #copyPick b{font-size:17px;font-weight:700;letter-spacing:-.01em} #copyPick small{font-size:14px;color:#7d7363}
  #copyClose{margin-left:auto;height:38px;min-width:38px;padding:0 8px;color:#8a8072}
  #copyText{flex:1;overflow:auto;padding:4px 22px 14px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:break-word;-webkit-overflow-scrolling:touch;
    font-family:"Nanum Myeongjo","Noto Serif KR","AppleMyungjo","Batang",serif;font-size:18px;line-height:1.85;color:#2f2b25;letter-spacing:.01em}
  #copyMenu{position:absolute;top:44px;left:8px;z-index:20;width:min(360px,calc(100vw - 32px));max-height:min(560px,calc(100vh - 140px));overflow:auto;padding:6px;
    background:#fffdf8;border-radius:14px;box-shadow:0 12px 32px -10px rgba(50,40,20,.45),0 0 0 1px rgba(60,45,20,.08);display:none}
  #copyMenu.open{display:block}
  #fsBtn.on{color:var(--red)}
  #kindMenu .orient{display:flex;gap:4px;padding:2px 4px 4px} #kindMenu .orient button{flex:1;height:44px;justify-content:center;gap:6px;font:500 14px/1 system-ui,sans-serif}
  #kindMenu .orient svg{width:22px;height:22px;filter:none}
  body.full #bar{position:fixed;left:0;right:0;top:0;transform:translateY(-110%);transition:transform .22s ease;z-index:60}
  body.full.showbar #bar{transform:none}
  body.full #desk{top:0}
  #fsHandle{position:fixed;bottom:10px;right:10px;z-index:61;display:none;width:40px;height:40px;min-width:40px;padding:0;justify-content:center;border-radius:50%;
    background:rgba(255,253,246,.72);box-shadow:0 1px 4px rgba(60,45,20,.22);color:#6d6355}
  body.full #fsHandle{display:inline-flex}
  #copyBtn.on{background:var(--pencil-soft);box-shadow:inset 0 -3px 0 var(--pencil)}
  #copyMenu .it{width:100%;height:auto;min-height:48px;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:10px;font-family:"Nanum Myeongjo","Noto Serif KR","AppleMyungjo","Batang",serif}
  #copyMenu .it b{font-size:16px;font-weight:700;white-space:normal;text-align:left} #copyMenu .it small{color:#8a8072;font-size:13px;flex:none}
  #copyMenu .it.on{background:var(--pencil-soft)}
  #copyMenu .mine{display:flex;flex-direction:column;gap:6px;margin-top:6px;padding:10px 6px 4px;border-top:1px solid #eee6d8}
  #copyMenu .mine .lb{color:#8a8072;font-size:13px}
  #copyMenu .mine input,#copyMenu .mine textarea{width:100%;box-sizing:border-box;border:1px solid #e2dccf;border-radius:10px;background:#fff;font-family:inherit;font-size:16px;line-height:1.5;padding:8px 10px;color:inherit}
  #copyMenu .mine textarea{height:120px;resize:vertical}
  #copyMenu .mine .pri{height:42px;justify-content:center;background:#c84c3a;color:#fff}

  #sheet{position:absolute;border-radius:2px;
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 1px 2px rgba(70,50,20,.18),0 18px 34px -18px rgba(70,50,20,.45);
    transition:transform .32s cubic-bezier(.3,.7,.2,1),opacity .32s}
  #sheet.out{transform:translateY(-38px) rotate(-1.2deg);opacity:0}
  #sheet.in{transform:translateY(26px);opacity:0;transition:none}
  #sheet canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  #ink{mix-blend-mode:multiply} #pen,#red{mix-blend-mode:multiply} #cover{filter:drop-shadow(0 .6px .7px rgba(70,55,35,.3))} body.litemode #cover{filter:none}
  body.litemode #ink,body.litemode #pen,body.litemode #red{mix-blend-mode:normal}
  #sheet.erasing{cursor:cell}
  #toast{position:fixed;left:50%;bottom:62px;transform:translate(-50%,16px);opacity:0;pointer-events:none;
    background:#fffdf6;color:var(--ink);font-size:14px;padding:10px 16px;border-radius:10px;
    box-shadow:0 8px 24px -10px rgba(70,50,20,.45);transition:all .25s}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #adv{display:none;position:absolute;right:0;top:calc(100% + 8px);width:280px;padding:14px 16px;background:#fffdf8;border-radius:14px;box-shadow:0 12px 32px -10px rgba(60,45,20,.45),0 0 0 1px rgba(60,45,20,.08);z-index:70;font-size:14px;color:#3a352d}
  #adv.open{display:block} #adv b{display:block;font-size:15px;margin-bottom:6px}
  #adv label{display:block;margin-top:12px} #adv label em{float:right;font-style:normal;color:#c84c3a;font-variant-numeric:tabular-nums}
  #adv input[type=range]{width:100%;margin-top:6px;accent-color:#c84c3a} #adv small{display:flex;justify-content:space-between;color:#8a8072;font-size:12px}
  #adv .segs{display:flex;gap:4px;margin-top:6px} #adv .segs button{flex:1;height:34px;border-radius:8px;background:rgba(60,45,20,.05);justify-content:center}
  #adv canvas.smp{display:block;width:100%;height:26px;margin-top:2px} #adv canvas.smp.tall{height:48px;margin-top:6px}
  #adv .segs button.on{background:#c84c3a;color:#fff} #adv .lite{margin-top:14px;height:34px;width:100%;justify-content:center;background:rgba(60,45,20,.05);border-radius:8px}
  @media (max-width:980px){ button span.l{display:none} #kindName{display:none} }
  @media (max-width:860px){ #bar .group button{min-width:40px;padding:0 5px} .size .seg{margin:0 2px} .size .seg button{padding:0 6px!important;font-size:13px} #bar{gap:2px;padding:0 4px} }
  @media (max-width:900px){ .size .seg button{padding:0 7px} .size{padding:0 2px} #cellInfo{display:none} .group{padding:0 2px} .status{display:none} .size span.l{display:none} button{padding:0 8px} #bar{gap:2px;padding:0 6px} }
  #curlCanvas{position:fixed;z-index:4;pointer-events:none;display:none}
  #pageNo{position:fixed;right:14px;bottom:12px;z-index:6;padding:4px 10px;border-radius:999px;font-size:13px;color:rgba(70,58,40,.75);
    background:rgba(255,253,246,.78);box-shadow:0 1px 3px rgba(0,0,0,.08);pointer-events:none;display:none}
  #pageNo{left:50%;right:auto;transform:translateX(-50%);display:none;align-items:center;gap:2px;padding:2px;pointer-events:auto}
  #pageNo.show{display:flex}
  #pageNo button{width:40px;height:34px;border:0;border-radius:999px;background:transparent;font-size:20px;color:#8a5a44;cursor:pointer}
  #pageNo button:disabled{opacity:.25}
  #pageNo span{min-width:64px;text-align:center}
  #docs{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(40,32,22,.28)}
  #docs.show{display:flex}
  .tearCv{position:fixed;z-index:5;pointer-events:none}
  #docs .card{width:min(520px,calc(100vw - 32px));max-height:min(620px,calc(100vh - 40px));display:flex;flex-direction:column;gap:10px;padding:16px;
    background:#fffdf8;border-radius:16px;box-shadow:0 12px 40px rgba(40,30,15,.25);font-size:15px;color:#2f2b25}
  #docs .hd{display:flex;align-items:center;gap:10px}#docs .hd b{font-size:18px}#docs .hd .kind{color:#8a8072;font-size:13px}
  #docs .hd .x{margin-left:auto}
  #docs .row{display:flex;gap:8px}#docs .row input{flex:1;min-width:0;height:42px;padding:0 12px;border:1px solid #e2dccf;border-radius:10px;font-size:16px;background:#fff}
  #docs button{height:42px;padding:0 14px;border:0;border-radius:10px;background:rgba(60,45,20,.07);font-size:15px;color:inherit;cursor:pointer}
  #docs button.pri{background:#c84c3a;color:#fff}
  #docs .row.ico{align-items:center;gap:6px;flex-wrap:wrap} #docs .row.ico button{display:inline-flex;align-items:center;gap:6px;padding:0 12px;white-space:nowrap} #docs .row.ico svg{width:20px;height:20px;flex:none} #docs .row.ico .sp{flex:1} #docs .row.ico #docPrint{width:42px;padding:0;justify-content:center}
  #docs .list{overflow:auto;display:flex;flex-direction:column;gap:6px;border-top:1px solid #eee6d8;padding-top:10px}
  #docs .item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:rgba(60,45,20,.035)}
  #docs .item.on{background:#fbefe9;box-shadow:inset 0 0 0 1.5px rgba(200,76,58,.35)}
  #docs .item .t{flex:1;min-width:0;display:flex;flex-direction:column}#docs .item .t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #docs .item .t small{color:#8a8072;font-size:12.5px}
  #docs .item .del.sure{background:#c84c3a;color:#fff}
  #docs .chk{display:flex;align-items:center;gap:6px;font-size:14px;color:#5e564a;white-space:nowrap}#docs .chk input{width:20px;height:20px;accent-color:#c84c3a}
  #docs .sub{margin-top:8px;color:#8a8072;font-size:13px}
  #docs .item.torn{background:rgba(60,45,20,.02);border:1px dashed #e2d7c4}
  @media (max-width:1500px){ #undo .l, #brush .l, #tearBtn .l, #sound .l, #soundLabel{display:none} }
  @media (max-width:1180px){ #newsheet .l, #save .l, #cellInfo{display:none} }
  #erMenu{position:absolute;top:50px;left:0;z-index:20;min-width:300px;padding:6px;background:#fffdf8;border-radius:14px;box-shadow:0 12px 32px -10px rgba(50,40,20,.45),0 0 0 1px rgba(60,45,20,.08);display:none}
  #erMenu.open{display:block}
  #erMenu button{width:100%;justify-content:flex-start;height:48px;gap:10px}
  #erMenu button.on{background:var(--pencil-soft)}
  #erMenu svg{width:36px;height:36px;flex:none;transform:rotate(-30deg) scale(1.12)}
  #erIcon svg{width:28px;height:28px;display:block;transform:rotate(-30deg) scale(1.12)}
  #erMenu small{margin-left:auto;color:var(--ink-soft);font-size:12px}
  /* 버튼 글자는 숨기고, 마우스를 올리면 이름이 뜬다 */
  #bar button span.l{display:none !important}
  #bar [data-tip]{position:relative}
  @media (hover:hover){ #bar [data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);white-space:nowrap;
    background:#2f2b25;color:#fff;font-size:13px;font-weight:500;line-height:1;padding:7px 10px;border-radius:8px;pointer-events:none;z-index:60;box-shadow:0 4px 12px rgba(0,0,0,.18)}
  #bar [data-tip]:hover::before{content:'';position:absolute;top:calc(100% + 3px);left:50%;transform:translateX(-50%);border:5px solid transparent;border-bottom-color:#2f2b25;z-index:60;pointer-events:none} }
  #penMenu.open ~ *, .penwrap:has(#penMenu.open) > button::after, .erwrap:has(#erMenu.open) > button::after, .penwrap:has(#penMenu.open) > button::before, .erwrap:has(#erMenu.open) > button::before{display:none}
</style>
</head>
<body>
<header id="bar">
  <span class="kindwrap"><button class="brand" id="kindBtn" aria-label="종이 고르기"><span id="kindIcon"></span><span class="nm" id="kindName">원고지</span><svg class="caret" viewBox="0 0 10 10"><path d="M2 4l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button><div id="kindMenu" role="menu"></div></span><button id="paperBtn" title="종이 색"><i id="paperDot" style="width:18px;height:18px;border-radius:50%;border:1px solid rgba(60,45,20,.35);display:inline-block"></i><span class="l" id="paperLabel">종이</span></button>
  <div class="group">
    <span class="penwrap"><button class="tool on" data-tool="pencil" id="penBtn" title="필기구 고르기"><span id="penIcon"></span><span class="l" id="penName">연필</span><svg class="caret" viewBox="0 0 10 10"><path d="M2 4l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      <div id="penMenu" role="menu"></div></span>
    <span class="erwrap" style="position:relative"><button class="tool" data-tool="eraser" title="지우개 고르기" id="erBtn">
      <span id="erIcon"></span><svg class="caret" viewBox="0 0 10 10"><path d="M2 4l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span class="l">지우개</span></button><div id="erMenu"></div></span>
  </div>
  <div class="group">
    <button id="undo" title="되돌리기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7L5 11l4 4"/><path d="M5 11h9a5 5 0 010 10h-2"/></svg><span class="l">되돌리기</span></button>
    <button id="brush" title="지우개 가루 털기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 15c3-1 6-4 8-8"/><path d="M8 18c3-1 7-4 9-8"/><path d="M13 20c2-1 5-3 7-6"/></svg><span class="l">털기</span></button>
    <button id="newsheet" title="새 종이"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M12 11v6M9 14h6" stroke-linecap="round"/></svg><span class="l">새 종이</span></button>

/* ───────────── 종이 결(치아) 텍스처 ─────────────
   연필 흑연은 종이 결의 볼록한 곳에 먼저 묻고, 세게 누를수록 오목한 곳까지 채워진다.
   종이 무늬와 흑연 무늬를 같은 결에서 만들어 둘이 맞물리게 한다. */
const TOOTH_N = 256;
const tooth = (() => {
  const N = TOOTH_N, rnd = mulberry32(20261125), f = new Float32Array(N * N);
  const octs = [[8, .20], [16, .18], [32, .22], [64, .22], [128, .18]];
  for (const [n, w] of octs) {
    const lat = new Float32Array(n * n);
    for (let i = 0; i < lat.length; i++) lat[i] = rnd();
    const cs = N / n;
    for (let y = 0; y < N; y++) {
      const gy = y / cs, y0 = gy | 0, fy = gy - y0, sy = fy * fy * (3 - 2 * fy), y1 = (y0 + 1) % n;
      for (let x = 0; x < N; x++) {
        const gx = x / cs * 0.82, x0 = gx | 0, fx = gx - x0, sx = fx * fx * (3 - 2 * fx), x1 = (x0 + 1) % n; // 가로로 살짝 늘린 섬유 결
        const a = lat[y0 * n + (x0 % n)], b = lat[y0 * n + x1], c = lat[y1 * n + (x0 % n)], d = lat[y1 * n + x1];
        const top = a + (b - a) * sx, bot = c + (d - c) * sx;
        f[y * N + x] += w * (top + (bot - top) * sy);
      }
    }
  }
  for (let i = 0; i < N * N; i++) f[i] += (rnd() - .5) * .22;
  let mn = 1e9, mx = -1e9;
  for (let i = 0; i < f.length; i++) { if (f[i] < mn) mn = f[i]; if (f[i] > mx) mx = f[i]; }
  for (let i = 0; i < f.length; i++) f[i] = (f[i] - mn) / (mx - mn);
  return f;
})();
function textureCanvas(fn){
  const c = document.createElement('canvas'); c.width = c.height = TOOTH_N;
  const g = c.getContext('2d'), img = g.createImageData(TOOTH_N, TOOTH_N), d = img.data;
  for (let i = 0; i < tooth.length; i++) { const [r, gg, b, a] = fn(tooth[i]); d[i*4] = r; d[i*4+1] = gg; d[i*4+2] = b; d[i*4+3] = a; }
  g.putImageData(img, 0, 0);
  return c;
}

const PENS = {

  bball: { name: '파란 볼펜', kind: 'ball', rgb: [30, 72, 186], r: .6 },
  rball: { name: '빨간 볼펜', kind: 'ball', rgb: [196, 30, 40], r: .6 },
  gball: { name: '초록 볼펜', kind: 'ball', rgb: [26, 110, 70], r: .6 },
  sign: { name: '사인펜',       kind: 'sign',     rgb: [24, 24, 28], r: 1.5 },
  psign: { name: '분홍 사인펜', kind: 'sign', rgb: [212, 78, 140], r: 1.5 },
  fountain: { name: '만년필',   kind: 'fountain', rgb: [26, 36, 92], r: 1.05 },
  sharp: { name: '샤프', kind: 'graphite', rgb: [60, 60, 68], r: .64, lo: .3, hi: .62, fixed: true },
  red:  { name: '빨간 색연필(채점)', kind: 'wax', rgb: [204, 32, 40], r: 1.9 },
  // 형광펜: 넓적한 촉으로 반투명하게 칠한다(겹치면 진해짐)
  hyellow: { name: '노랑 형광펜', kind: 'hl', rgb: [246, 226, 40], r: 8 },
  hpink: { name: '분홍 형광펜', kind: 'hl', rgb: [244, 112, 170], r: 8 },

const KINDS = {

  let g = '';

   1929년 이전에 발표된 시만 담았다(저작권이 끝난 시). 원문(위키문헌 영인본 옮김)을 보고 오늘날 맞춤법으로 옮겼다.

const POEMS = [
  { id: 'jindallae', title: '진달래꽃', by: '김소월', year: '1922', text:

  { id: 'sanyuhwa', title: '산유화', by: '김소월', year: '1925', text:
`산에는 꽃 피네

  { id: 'chimmuk', title: '님의 침묵', by: '한용운', year: '1926', text:
`님은 갔습니다 아아 사랑하는 나의 님은 갔습니다
푸른 산빛을 깨치고 단풍나무 숲을 향하여 난 작은 길을 걸어서 차마 떨치고 갔습니다

날카로운 첫 「키스」의 추억은 나의 운명의 지침을 돌려놓고 뒷걸음쳐서 사라졌습니다
나는 향기로운 님의 말소리에 귀먹고 꽃다운 님의 얼굴에 눈멀었습니다
사랑도 사람의 일이라 만날 때에 미리 떠날 것을 염려하고 경계하지 아니한 것은 아니지만 이별은 뜻밖의 일이 되고 놀란 가슴은 새로운 슬픔에 터집니다
그러나 이별을 쓸데없는 눈물의 원천을 만들고 마는 것은 스스로 사랑을 깨치는 것인 줄 아는 까닭에 걷잡을 수 없는 슬픔의 힘을 옮겨서 새 희망의 정수박이에 들어부었습니다
우리는 만날 때에 떠날 것을 염려하는 것과 같이 떠날 때에 다시 만날 것을 믿습니다
아아 님은 갔지마는 나는 님을 보내지 아니하였습니다
제 곡조를 못 이기는 사랑의 노래는 님의 침묵을 휩싸고 돕니다` },
  { id: 'alsu', title: '알 수 없어요', by: '한용운', year: '1926', text:
`바람도 없는 공중에 수직의 파문을 내이며 고요히 떨어지는 오동잎은 누구의 발자취입니까
지리한 장마 끝에 서풍에 몰려가는 무서운 검은 구름의 터진 틈으로 언뜻언뜻 보이는 푸른 하늘은 누구의 얼굴입니까
꽃도 없는 깊은 나무에 푸른 이끼를 거쳐서 옛 탑 위의 고요한 하늘을 스치는 알 수 없는 향기는 누구의 입김입니까

  { id: 'narutbae', title: '나룻배와 행인', by: '한용운', year: '1926', text:
`나는 나룻배
당신은 행인

풀섶 이슬에 함추름 휘적시던 곳,

전설 바다에 춤추는 밤물결 같은
검은 귀밑머리 날리는 어린 누이와
아무렇지도 않고 예쁠 것도 없는
사철 발 벗은 아내가
따가운 햇살을 등에 지고 이삭 줍던 곳,

―그곳이 차마 꿈엔들 잊힐 리야.

하늘에는 성근 별
알 수도 없는 모래성으로 발을 옮기고,
서리 까마귀 우지짖고 지나가는 초라한 지붕,
흐릿한 불빛에 돌아앉아 도란도란거리는 곳,

―그곳이 차마 꿈엔들 잊힐 리야.` },
  { id: 'ppaeatgin', title: '빼앗긴 들에도 봄은 오는가', by: '이상화', year: '1926', text:
`지금은 남의 땅―빼앗긴 들에도 봄은 오는가?

나는 온몸에 햇살을 받고
푸른 하늘 푸른 들이 맞붙은 곳으로
가르마 같은 논길을 따라 꿈속을 가듯 걸어만 간다.

입술을 다문 하늘아 들아
내 맘에는 내 혼자 온 것 같지를 않구나
네가 끌었느냐 누가 부르더냐 답답워라 말을 해 다오.

바람은 내 귀에 속삭이며
한 자국도 섰지 마라 옷자락을 흔들고
종조리는 울타리 너머 아씨같이 구름 뒤에서 반갑다 웃네.

고맙게 잘 자란 보리밭아
간밤 자정이 넘어 내리는 고운 비로
너는 삼단 같은 머리를 감았구나 내 머리조차 가뿐하다.

혼자라도 가쁘게나 가자
마른 논을 안고 도는 착한 도랑이
젖먹이 달래는 노래를 하고 제 혼자 어깨춤만 추고 가네.

나비 제비야 깝치지 마라
맨드라미 들마꽃에도 인사를 해야지
아주까리기름을 바른 이가 지심 매던 그 들이라 다 보고 싶다.

내 손에 호미를 쥐어 다오
살진 젖가슴과 같은 부드러운 이 흙을
발목이 시도록 밟아도 보고 좋은 땀조차 흘리고 싶다.

강가에 나온 아이와 같이
짬도 모르고 끝도 없이 닫는 내 혼아
무엇을 찾느냐 어디로 가느냐 우스웁다 답을 하려무나.

나는 온몸에 풋내를 띠고
푸른 웃음 푸른 설움이 어우러진 사이로
다리를 절며 하루를 걷는다 아마도 봄 신령이 지폈나 보다.
그러나 지금은―들을 빼앗겨 봄조차 빼앗기겠네.` }

/* 가득 보기: 도구 막대를 숨기고 종이를 화면 가득. 아이패드 사파리의 '전체 화면'은 펜으로 많이 쓰면 '가짜 키보드' 경고를 띄워서 쓰지 않는다 */
let fullOn = false;
const isFull = () => fullOn;
const isIOS = /iP(ad|hone|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches));
/* 배치: 먼저 고른 용지 방향(가로형·세로형)의 가상 종이에서 칸 수를 정하고, 그 칸 수 그대로 지금 화면에 맞춘다.
   그래서 태블릿을 돌려도 칸 수가 바뀌지 않고 종이 크기만 달라진다(끝에 쓴 글씨가 잘리지 않음) */
function layoutCore(vw, vh, F){   // F: 칸 수를 정해 두고 크기만 맞출 때 { cols, rows, gw, gh(칸 단위 격자 크기), sMax }
  const pad = isFull() ? 24 : vw < 700 ? 8 : 18;   // 가득 보기도 가장자리에 틈을 남긴다(찢기·장 넘기기를 종이 바깥에서 시작)
  const W = vw - pad * 2, H = vh - pad * 2;
  const nb = state.mode === 'notebook', vert = state.mode === 'vmanuscript', lined = state.mode === 'lined', plain = state.mode === 'plain', free = lined || plain;
  const m = clamp(Math.min(W, H) * .045, nb || free ? 30 : 22, 44);
  const headH = nb || free ? 40 : vert ? 30 : 22, footH = free ? 14 : vert ? 30 : 24;
  const gap = nb ? .32 : free ? 0 : vert ? .3 : .40;
  const mm = vert ? m + 8 : m;   // 세로 원고지는 테두리가 칸에서 떨어진 만큼 바깥 여백도
  const innerW = W - 2 * mm, innerH = H - 2 * mm - headH - footH;
  const O = { nb, vert, free, lined, plain, m: mm, headH, footH, gap };
  if (F) {
    const sv = Math.min(innerW / F.gw, innerH / F.gh, F.sMax || 1e9);   // sMax 0 = 화면 가득
    Object.assign(O, { cols: F.cols, rows: F.rows, s: sv, gridW: F.gw * sv, gridH: F.gh * sv });
  } else if (vert || free) {   // 세로 원고지: 칸이 위에서 아래로 이어지는 세로줄(오른쪽부터 씀) · 줄·무지 공책: 줄 간격만큼 나눈 빈 바탕
    const R0 = SIZE_RANGE[state.mode]; let s0 = clamp(state.cell[state.mode] || R0[0], R0[0], R0[1]);
    let rows0, cols0;
    if (vert) {
      if (vh > vw) { rows0 = 20; s0 = Math.min(s0 * 1.25, innerH / 20); }   // 세로형 용지: 진짜 세로 원고지처럼 한 줄 20칸을 꽉 채운다
      else { rows0 = Math.min(20, Math.max(6, Math.floor(innerH / s0))); s0 = Math.min(s0, innerH / rows0); }
      cols0 = Math.max(3, Math.floor((innerW + gap * s0) / (s0 * (1 + gap))));
    }
    else { cols0 = Math.max(4, Math.floor(innerW / s0)); rows0 = Math.max(4, Math.floor(innerH / s0)); }
    Object.assign(O, { cols: cols0, rows: rows0, s: s0, gridW: vert ? cols0 * s0 + (cols0 - 1) * gap * s0 : (free ? innerW : cols0 * s0), gridH: rows0 * s0 });
  } else {
    // 칸 크기는 사용자가 고른다. 한 줄에 들어가는 칸 수는 종이 폭에 맞춰 정해지고, 원고지는 최대 20칸.
    const R = SIZE_RANGE[state.mode];
    let sz = clamp(state.cell[state.mode], R[0], R[1]);
    const cols = Math.min(nb ? 12 : 20, Math.max(nb ? 4 : 8, Math.floor(innerW / sz)));
    sz = Math.min(sz, innerW / cols);
    let rows = Math.floor((innerH + gap * sz) / (sz * (1 + gap)));

}
function layoutKey(){ const pg = (typeof Book !== 'undefined' && Book.ready && bookOn()) ? curPage() : null; return [state.mode, state.orient, state.cell[state.mode], isFull(), pg && pg.g && pg.strokes && pg.strokes.length ? JSON.stringify(pg.g) : ''].join('|'); }
function computeLayout(){

  let F;

    F = { cols: pg.g.cols, rows: pg.g.rows, gw: pg.g.gw, gh: pg.g.gh, sMax: isFull() ? 0 : (pg.cs || state.cell[state.mode]) };
  } else if (isFull() && (state.mode === 'manuscript' || state.mode === 'vmanuscript')) {   // 전체 화면 원고지: 가로형 200자(20칸×10줄), 세로형 400자(20칸×20줄)
    const n = land ? 10 : 20;
    F = state.mode === 'manuscript' ? { cols: 20, rows: n, gw: 20, gh: n + (n - 1) * .40 } : { cols: n, rows: 20, gw: n + (n - 1) * .3, gh: 20 };
  } else {
    const V = layoutCore(land ? lng : sht, (land ? sht : lng) - bh, null);   // 고른 용지 방향의 가상 종이
    F = { cols: V.cols, rows: V.rows, gw: V.gridW / V.s, gh: V.gridH / V.s, sMax: V.s };
  }
  const A = layoutCore(dw, dh - top0, F);
  for (const k in L) delete L[k];
  Object.assign(L, A); L.top += top0; L.o = state.orient; L.cs = state.cell[state.mode]; L.key = layoutKey();
}
function applyLayout(){

/* ───────────── 종이와 칸 ───────────── */
function drawPaper(){
  const g = pctx, W = paperC.width, H = paperC.height, D = DPR;
  g.setTransform(1, 0, 0, 1, 0, 0);

  g.globalAlpha = .05; g.fillStyle = pattern(g, shadeTex, GRAIN * 9); g.fillRect(0, 0, W, H);
  // 섬유
  const rnd = mulberry32(7);
  const n = Math.round(L.w * L.h / 5200);
  g.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const x = rnd() * W, y = rnd() * H, len = (4 + rnd() * 14) * D, ang = (rnd() - .5) * 1.2;
    const light = rnd() < .35;
    g.globalAlpha = light ? .35 : .07;
    g.strokeStyle = light ? '#ffffff' : PP.fiber;
    g.lineWidth = (.4 + rnd() * .5) * D;
    g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo(x + Math.cos(ang) * len * .5 + (rnd() - .5) * 3 * D, y + Math.sin(ang) * len * .5 + (rnd() - .5) * 3 * D, x + Math.cos(ang) * len, y + Math.sin(ang) * len);

  vg.addColorStop(0, PP.vig + '0)'); vg.addColorStop(1, PP.vig + PP.vigA + ')');
  g.globalAlpha = 1; g.fillStyle = vg; g.fillRect(0, 0, W, H);

  paperBaseC.width = W; paperBaseC.height = H; paperBaseC.getContext('2d').drawImage(paperC, 0, 0);

}
const px = v => Math.round(v * DPR) + .5; // 선을 픽셀에 맞춰 또렷하게

  if (L.free) {   // 줄·무지 공책: 위쪽에 날짜 적는 자리, 줄 공책은 푸른 회색 괘선(맨 윗줄은 두 줄)
    const blue = 'rgba(92,116,160,.55)', faint = 'rgba(110,104,92,.55)', x0 = L.gx, x1 = L.gx + L.gridW;
    g.fillStyle = faint; g.strokeStyle = faint; g.font = `${11.5 * D}px ${serif}`; g.textBaseline = 'alphabetic';
    const base = (L.m + 24) * D; g.textAlign = 'left'; g.fillText('No.', x0 * D, base); g.fillText('Date', (x1 - 168) * D, base);

    g.stroke();

      }
      g.stroke(); g.restore();

      g.font = `${12 * D}px ${serif}`; g.textAlign = 'right'; g.textBaseline = 'middle';

    }
  }
  g.textBaseline = 'alphabetic';
  if (L.nb) {
    g.font = `700 ${15 * D}px ${serif}`; g.textAlign = 'left';
    g.fillText('받아쓰기 공책', L.gx * D, (L.m + L.headH * .55) * D);

    g.fillText('원 고 지', (L.gx - o) * D, (L.gy + L.gridH + o + 16) * D);
  }
  g.restore();
}

function soundTurn(p, sharp, tool){

    const g = ac.createGain(); g.gain.setValueAtTime(amp, t); g.gain.exponentialRampToValueAtTime(.0002, t + .002);

  };

setModeButtons(); setSoundUI(); updateStatus(); setSizeUI(); setPaperUI(); setPenUI();
applyLayout();
function refreshTips(){   // title → 마우스를 올렸을 때 뜨는 이름표(브라우저 기본 이름표와 겹치지 않게 title은 비운다)
  document.querySelectorAll('#bar button').forEach(b => {
    if (b.title) { b.dataset.tip = b.title; b.setAttribute('aria-label', b.title); b.removeAttribute('title'); }
  });
  const pb = $('#penBtn'); if (pb && PENS[state.pen]) pb.dataset.tip = PENS[state.pen].name;
  const eb = $('#erBtn'); if (eb) eb.dataset.tip = erOf(state.eraser).name;
}
refreshTips();
window.__sseugi = { state, L, redrawInk, Book, curBook };  // 시험용
loadBooks().then(() => { const p = curPage(); if (state.strokes.length) p.strokes = p.strokes.concat(state.strokes); showPage(); });
})();

// 한 번 열면 이 기기에 저장해 두고 인터넷 없이 연다
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
